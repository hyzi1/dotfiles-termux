#===
# Cache

# Seven seconds: enough for one operation, gone before anyone notices.
default-cache-ttl 7
max-cache-ttl 7
#===

#===
# Pinentry

# Termux: pkg i pinentry
# Plain text prompt, age style. No full-screen theater.
pinentry-program /data/data/com.termux/files/usr/bin/pinentry-tty

# A forgotten prompt shouldn't sit there waiting to be useful to someone else.
pinentry-timeout 30
#===
