#===
# Crypto

# Negotiation picks the strongest cipher both sides speak. Lead with the best.
personal-cipher-preferences AES256 AES192 AES

# SHA1 had its moment. It's over.
personal-digest-preferences SHA512 SHA384 SHA256

# ZLIB first: compressed and integrity-checked in one shot.
personal-compress-preferences ZLIB BZIP2 ZIP

# Key certifications deserve the same respect as data signatures.
cert-digest-algo SHA512

# Stamped into keys created after this line. Old keys keep their old habits.
default-preference-list SHA512 SHA384 SHA256 AES256 AES192 AES ZLIB BZIP2 ZIP Uncompressed

# An alarm, not armor: modern gpg flags SHA1 alone, this covers the stubborn ones.
weak-digest SHA1
#===

#===
# Privacy

# Version strings are free intel for strangers. Keep them guessing.
no-emit-version
no-comments

# Hides who the message is for. Quieter, not stronger.
throw-keyids

# The session key cache is convenience, not a friend.
no-symkey-cache

# Fetching keys while verifying leaks what you care about.
no-auto-key-retrieve
#===
