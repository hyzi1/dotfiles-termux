# Crypto

personal-cipher-preferences AES256 AES192 AES

personal-digest-preferences SHA512 SHA384 SHA256

# Order of compression algorithms when compression is actually used.
personal-compress-preferences ZLIB BZIP2 ZIP

# Key certifications follow the same digest standard as data signatures.
cert-digest-algo SHA512

# Applied to keys created after this setting; existing keys keep their stored preferences.
default-preference-list SHA512 SHA384 SHA256 AES256 AES192 AES ZLIB BZIP2 ZIP Uncompressed

# Mark SHA1 as rejected during verification instead of accepting it silently.
weak-digest SHA1

# Privacy

# Omit software version strings from output.
no-emit-version
no-comments

# Hide recipient key IDs in encrypted messages.
throw-keyids

# Do not cache derived symmetric session keys in memory.
no-symkey-cache

# Do not fetch unknown keys from servers during verification.
no-auto-key-retrieve

# Compression
compress-level 0
