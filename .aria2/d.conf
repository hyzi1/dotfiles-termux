# Design for optimizing downloads using mobile data.

dir=/data/data/com.termux/files/home/storage/downloads/add/aria2/
continue=true
max-connection-per-server=2
split=2
min-split-size=5M
max-concurrent-downloads=1
max-tries=5
retry-wait=10
timeout=30
connect-timeout=30
disable-ipv6=true
disk-cache=32M
file-allocation=none
