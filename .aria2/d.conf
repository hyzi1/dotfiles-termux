dir=storage/shared/Download/Aria2

continue=true

max-connection-per-server=2
split=2
min-split-size=20M
max-concurrent-downloads=1

max-tries=0
retry-wait=10
timeout=30
connect-timeout=30
disable-ipv6=true

disk-cache=32M
file-allocation=none
http-accept-gzip=true

auto-save-interval=30
force-save=true
allow-overwrite=false
auto-file-renaming=false
