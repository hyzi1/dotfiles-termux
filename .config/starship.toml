"$schema" = 'https://starship.rs/config-schema.json'

format = """
\
[╭─](5)\
[󰣨 ](bg:5 fg:0)\
[](bg:0 fg:5)\
$directory\
$git_branch\


[](bg:4 fg:0)\

[](bg:2 fg:4)\

[](bg:5 fg:2)\
[](fg:5)\
\n$character"""


[directory]
style = "fg:7 bg:0"
format = "[ $path ]($style)"
truncation_length = 2
truncation_symbol = ""


[directory.substitutions]
"Documents" = "󰈙 "
"~" = "󰥹 "
"shared" = "󰋊 "
"Download" = " "
"Music" = " "
"Pictures" = " "


[git_branch]
symbol = ""
format = '[[ $symbol$branch ](fg:5 bg:0)]($style)'

[character]
success_symbol = "[│\n╰─➤](purple)"
error_symbol = "[│\n╰─➤](purple)"
